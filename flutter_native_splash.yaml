# Native splash di OnList Club.
#
# Obiettivo: la schermata nativa (disegnata dall'OS prima che Flutter carichi)
# deve essere IDENTICA allo splash dell'app, così l'utente vede un solo
# passaggio invece di "nero di sistema → splash Flutter".
#
# Come replichiamo lo splash app (gradiente radiale #0107D6→#000000 + logo):
#   - background_image = PNG del gradiente (replica onboardingBackground),
#     usato su iOS e Android < 12.
#   - image = logo OnList centrato (stesso asset del Flutter splash).
#   - color = nero, base dei gradienti (fallback + sfondo pieno su Android 12+,
#     dove l'OS NON consente immagini di sfondo, solo colore + icona centrata).
#
# L'app è sempre dark: le varianti *_dark sono identiche così su Android in
# light-mode non compare il flash bianco di default.
#
# ⚠️ Dopo ogni modifica qui (o al gradiente/logo) rigenerare gli asset nativi:
#     flutter pub get
#     dart run flutter_native_splash:create
#
# 🛑 TRAPPOLA NOTA — RIFARE A MANO DOPO OGNI RIGENERAZIONE:
#   Il tool accoppia `fullscreen` a `windowDrawsSystemBarBackgrounds`: con
#   `fullscreen: false` genera ENTRAMBI a false nei 4 res/values*/styles.xml.
#   Ma con windowDrawsSystemBarBackgrounds=false Android IGNORA la brightness
#   delle icone → status bar con icone scure invisibili sugli sfondi dark.
#   Dopo `flutter_native_splash:create` rimettere a mano in tutti e 4 i file:
#       <item name="android:windowDrawsSystemBarBackgrounds">true</item>
#   (mantenendo windowFullscreen=false). Nessuna opzione del tool lo evita.
flutter_native_splash:
  # NB: niente `color` a questo livello. Se c'è, flutter_native_splash lo usa
  # come sfondo (un pixel 1×1 stirato) e IGNORA background_image → si perde il
  # gradiente. Con solo background_image, iOS e Android<12 usano il PNG del
  # gradiente. Il colore serve solo ad android_12 (l'OS lì vieta le immagini).
  # Il logo è la SCRITTA "OnList" intera, come il Figma nuovo del 27/09
  # (off/01 - Prima pagina.png, intro.css: 229×97 centrata). Il tool tratta il
  # PNG sorgente come 4x, quindi 229×97 logici = 916×388 px: è esattamente la
  # misura di `logo_onlist_wordmark.png`, generato dall'asset brand ufficiale.
  # Se cambia la dimensione qui, va cambiata anche in `splash_screen.dart`,
  # altrimenti il logo salta nel passaggio nativa → Flutter.
  background_image: "assets/native_splash/splash_bg.png"
  image: "assets/native_splash/logo_onlist_wordmark.png"

  background_image_dark: "assets/native_splash/splash_bg.png"
  image_dark: "assets/native_splash/logo_onlist_wordmark.png"

  # Android 12+: l'OS impone il suo formato (colore pieno + icona centrata
  # mascherata a cerchio). Niente gradiente possibile qui: restiamo sul nero
  # base del design system.
  #
  # E niente scritta: dentro una maschera circolare una scritta larga 2,4 volte
  # la sua altezza verrebbe tagliata ai lati. Qui resta il solo marchio, che è
  # quadrato e regge il ritaglio. È un limite dell'API di Android 12, non una
  # scelta: su quei telefoni il passaggio marchio → scritta si vede.
  android_12:
    color: "#000000"
    image: "assets/native_splash/logo_onlist_mark.png"
    color_dark: "#000000"
    image_dark: "assets/native_splash/logo_onlist_mark.png"

  android: true
  ios: true
  web: false

  # NON fullscreen: con `true` il tool nasconde la status bar durante lo splash
  # (Android windowFullscreen, iOS UIStatusBarHidden) e all'uscita le icone di
  # sistema (ora/batteria/segnale) perdono lo stile chiaro dell'app e restano
  # nere/invisibili sugli sfondi scuri. Lo splash col gradiente dietro una status
  # bar normale (icone bianche, vedi main.dart) va benissimo.
  fullscreen: false
