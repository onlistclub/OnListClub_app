name: OnListClub
description: A new Flutter project.
version: 1.0.0+1
environment: 
  sdk: ^3.6.0
dependencies: 
  flutter:   # 🚨 CRITICAL: Required for every Flutter project - DO NOT REMOVE
    sdk: flutter # 🚨 CRITICAL: Required for every Flutter project - DO NOT REMOVE
  flutter_localizations: 
    sdk: flutter
  flutter_svg: ^2.0.12
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.3
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  supabase_flutter: ^2.6.0
  intl_phone_number_input: ^0.7.4
  google_fonts: ^8.0.1
  intl: ^0.20.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.3
  geolocator: ^14.0.3
  url_launcher: ^6.3.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  qr_flutter: ^4.1.0
  device_info_plus: ^13.2.0
  # Versione dell'app negli eventi analytics: letta dal pubspec a runtime
  # invece di essere ricopiata a mano in analytics_service.dart. Era già nel
  # pubspec.lock come dipendenza transitiva, qui la dichiariamo perché la
  # usiamo direttamente.
  package_info_plus: ^10.2.0
  # Foto profilo (schermata Account): selezione immagine da galleria/fotocamera,
  # poi upload su Supabase Storage (bucket `avatars`).
  image_picker: ^1.1.2
dev_dependencies:
  flutter_test:    # 🚨 CRITICAL: Required for Flutter project testing - DO NOT REMOVE
    sdk: flutter   # 🚨 CRITICAL: Required for Flutter project testing - DO NOT REMOVE
  flutter_launcher_icons: ^0.14.4
  # Genera la native splash (iOS/Android) uguale allo splash dell'app: nessuno
  # stacco tra schermata di sistema e primo frame Flutter. Config in
  # flutter_native_splash.yaml. Rigenerare con: dart run flutter_native_splash:create
  flutter_native_splash: ^2.4.4
# ...resto del file...   

flutter:
  uses-material-design: true # 🚨 CRITICAL: Required for Material icon font - DO NOT REMOVE
  assets:
    - assets/
    - assets/images/
    - assets/images/2.0x/
    - assets/images/3.0x/
    - assets/svg/
    - assets/svg/ufficiali/
    # env.json NON va qui: un asset finisce dentro l'APK/IPA e chiunque può
    # estrarlo. Le chiavi entrano a build-time con
    # `--dart-define-from-file=env.json` (vedi run_dev.bat / lib/main.dart).
  fonts:
    # I file OnlistHN-*.otf sono gli stessi glifi e le stesse metriche dei
    # vecchi HelveticaNeue*.otf: cambia SOLO il nome dichiarato dentro il file
    # (famiglia, nome completo, nome PostScript), da "Helvetica Neue" a
    # "OnlistHN".
    #
    # Perche': su iOS "Helvetica Neue" e' una famiglia di SISTEMA. Rinominare
    # solo il `family:` qui sotto non bastava — il nome interno continuava a
    # collidere, e le facce venivano risolte contro quelle di sistema, dove il
    # w500 finisce sul Regular. Da qui i grassetti che sparivano sul telefono e
    # si vedevano su desktop.
    #
    # I vecchi file restano in assets/fonts/ ma NON sono piu' dichiarati: non
    # finiscono nel bundle. Non rimetterli.
    - family: OnlistHN
      fonts:
        - asset: assets/fonts/OnlistHN-Light.otf
          weight: 300
        - asset: assets/fonts/OnlistHN-Roman.otf
          weight: 400
        - asset: assets/fonts/OnlistHN-Medium.otf
          weight: 500
        - asset: assets/fonts/OnlistHN-Bold.otf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  # Sorgente icona GIÀ appiattita su nero (opaca, senza alpha): flutter_launcher_icons
  # sbagliava il compositing del glow viola semi-trasparente su nero producendo un
  # artefatto verde. Pre-appiattendo con Pillow il tool non deve comporre l'alpha.
  # File fuori da assets/ così non viene incluso nel bundle a runtime (serve solo al build).
  image_path: "launcher/logo_onlist_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#000000"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "launcher/logo_onlist_icon.png"
