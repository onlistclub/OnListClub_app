<!doctype html>
<!--
  Pagina di conferma raggiunta dopo la cancellazione account riuscita.
  URL finale: https://www.onlistclub.com/auth/account-deleted

  È una pagina statica: niente Supabase, niente form. A questo punto l'account
  non esiste più, quindi NON c'è alcuna CTA per rientrare nell'app: l'unica
  strada è registrarsi di nuovo.
-->
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Account eliminato — Onlist Club</title>
  <style>
    :root {
      --black: #000000;
      --white: #FFFFFF;
      --blue-electric: #1E00FF;
      --blue-deep: #060037;
      --blue-violet: #201064;
      --blue-intense: #1500B3;
      --grey: #8E8E93;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
      color: var(--white);
      background: var(--black);
      background-image: linear-gradient(180deg, #000000 0%, #060037 100%);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .wordmark {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 24px;
      user-select: none;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(180deg, #1500B3 0%, #201064 100%);
      border-radius: 24px;
      padding: 40px 28px 32px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(30, 0, 255, 0.18);
    }

    .check {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      border-radius: 1000px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.6px;
    }

    p.lead {
      margin: 0 0 28px;
      font-size: 16px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.85);
    }

    .cta {
      display: inline-block;
      width: 100%;
      padding: 14px 16px;
      border: 0;
      border-radius: 7px;
      background: var(--blue-electric);
      color: var(--white);
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    .cta:hover { opacity: 0.92; }
    .cta:active { transform: translateY(1px); }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--grey);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="wordmark">ONLIST&nbsp;CLUB</div>

    <section class="card">
      <div class="check" aria-hidden="true">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
             xmlns="http://www.w3.org/2000/svg">
          <path d="M5 12.5l4.5 4.5L19 7.5" stroke="#FFFFFF" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1>Account eliminato</h1>
      <p class="lead">
        Il tuo account Onlist Club è stato eliminato definitivamente e i tuoi
        dati personali sono stati rimossi. Puoi disinstallare l'app: da qui non
        c'è più niente da fare.
      </p>

      <a class="cta" href="https://www.onlistclub.com">Torna al sito</a>
    </section>

    <p class="footer">© Onlist Club</p>
  </main>
</body>
</html>
